name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      # cargo publish writes the crate in Cargo.toml. The tag has to name
      # that same version.
      - name: The tag names the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/crate_version.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1.0.5
        id: auth
      - name: Publish ljos-policyd
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --no-verify
