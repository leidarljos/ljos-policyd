name: test

on:
  push:
    branches: [main, develop, '*-2026*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  phronesis:
    name: test with phronesis linked
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The tag the release links, so a test and a release build sit on the
      # same phronesis. v0.2.5 matches a vendor secret prefix only at a
      # token boundary, so `task-creation`, `disk-usage.rs` and `risk-notes`
      # are allowed; v0.2.4 matched `sk-` inside those words.
      PHRONESIS_REF: v0.2.5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build capnproto pkg-config
      - name: Build phronesis
        run: |
          set -eu
          git clone --depth 1 --branch "$PHRONESIS_REF" \
            https://github.com/leidarljos/phronesis "$RUNNER_TEMP/phronesis"
          cd "$RUNNER_TEMP/phronesis"
          meson setup build --prefix="$RUNNER_TEMP/phronesis-prefix" -Dtests=disabled
          meson compile -C build
          meson install -C build
          echo "PHRONESIS_DIR=$RUNNER_TEMP/phronesis-prefix" >> "$GITHUB_ENV"
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
        env:
          PHRONESIS_STATE_DIR: ${{ runner.temp }}/policyd-state
      - name: Static link, phronesis backend
        run: |
          set -eu
          cargo build --locked --release
          target/release/ljos-policyd version | grep -q '(phronesis)'
          ! readelf -d target/release/ljos-policyd | grep -E 'RPATH|RUNPATH'
          ! ldd target/release/ljos-policyd | grep -E 'phronesis|capnp'

  licenses:
    name: cargo deny check licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      # Built from source, so the job pulls no image from Docker Hub.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: deny
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}-${{ runner.arch }}
      - name: Build cargo-deny 0.20.2 from source
        if: steps.deny.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: cargo deny check licenses
        run: cargo deny check licenses
