name: test

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Draft only: the notes are printed and CHANGELOG.md is not written.
      # towncrier 26.9.0 fails this when a fragment name is not a configured
      # type, because towncrier.toml sets ignore. The version is the crate's;
      # this tree is not a Python package towncrier can read.
      - name: Changelog draft
        run: |
          set -eu
          python -m pip install -q 'towncrier==26.9.0'
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          python -m towncrier build --draft --version "$version"
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  phronesis:
    name: test with phronesis linked
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The commit the release links, so a test and a release build sit on
      # the same phronesis: phronesis 0.2.9, the import of the recreated
      # repository, which keeps no release tags.
      PHRONESIS_REF: 7d115de79407a54e0be5050f95107cfa08fe6277
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build capnproto pkg-config
      - name: Build phronesis
        run: |
          set -eu
          # A commit, not a tag: the phronesis repository keeps no
          # release tags. A branch name works too.
          git init -q "$RUNNER_TEMP/phronesis"
          cd "$RUNNER_TEMP/phronesis"
          git remote add origin https://github.com/leidarljos/phronesis.git
          git fetch --depth 1 origin "$PHRONESIS_REF"
          git checkout --detach FETCH_HEAD
          meson setup build --prefix="$RUNNER_TEMP/phronesis-prefix" -Dtests=disabled
          meson compile -C build
          meson install -C build
          echo "PHRONESIS_DIR=$RUNNER_TEMP/phronesis-prefix" >> "$GITHUB_ENV"
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
        env:
          PHRONESIS_STATE_DIR: ${{ runner.temp }}/policyd-state
      - name: Static link, phronesis backend
        run: |
          set -eu
          cargo build --locked --release
          target/release/ljos-policyd version | grep -q '(phronesis)'
          ! readelf -d target/release/ljos-policyd | grep -E 'RPATH|RUNPATH'
          ! ldd target/release/ljos-policyd | grep -E 'phronesis|capnp'

  licenses:
    name: cargo deny check licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      # Built from source, so the job pulls no image from Docker Hub.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: deny
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}-${{ runner.arch }}
      - name: Build cargo-deny 0.20.2 from source
        if: steps.deny.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: cargo deny check licenses
        run: cargo deny check licenses
