name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # Runs the build jobs on a branch without publishing a release.
  workflow_dispatch:
    inputs:
      phronesis_ref:
        description: phronesis tag or branch to link (default is Cargo.toml)
        required: false
        default: ""

permissions:
  contents: write

env:
  # A manual run may name another ref. A tag build reads
  # package.metadata.phronesis.rev. v0.2.3 keeps a shell word up to 128 KiB
  # and up to 32768 words, and a longer word, count, or command body is
  # fieldTooLong with a reason. v0.2.4 adds the download, setgid and
  # lease-push law the table matches. v0.2.5 matches a vendor secret prefix
  # only at a token boundary. v0.2.7 reads `git restore --staged .`, `-S`
  # included, as an unstage.
  PHRONESIS_REF: ${{ inputs.phronesis_ref }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            cross: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The binary reports the crate version. A tag that names another
      # version would publish that binary under the wrong name.
      - name: The tag names the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/crate_version.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build capnproto pkg-config
      - name: Build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install meson ninja capnp pkg-config
      - name: Build phronesis
        run: |
          set -eu
          if [ -z "${PHRONESIS_REF:-}" ]; then
            PHRONESIS_REF=$(python3 scripts/crate_version.py --phronesis-rev)
            echo "PHRONESIS_REF=$PHRONESIS_REF" >> "$GITHUB_ENV"
          fi
          echo "linking phronesis $PHRONESIS_REF"
          git init -q "$RUNNER_TEMP/phronesis"
          cd "$RUNNER_TEMP/phronesis"
          git remote add origin https://github.com/leidarljos/phronesis.git
          git fetch --depth 1 origin "$PHRONESIS_REF"
          git checkout --detach FETCH_HEAD
          if printf '%s' "$PHRONESIS_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            test "$(git rev-parse HEAD)" = "$PHRONESIS_REF"
            test "$(tr -d '[:space:]' < VERSION)" = "$(python3 "$GITHUB_WORKSPACE/scripts/crate_version.py" --phronesis-version)"
          fi
          cross=()
          if [ -n "${{ matrix.cross }}" ]; then
            # Intel macOS from the arm runner; Rosetta runs the test binaries.
            cat > "$RUNNER_TEMP/cross.ini" <<'INI'
          [binaries]
          c = ['clang', '-arch', 'x86_64']
          cpp = ['clang++', '-arch', 'x86_64']
          ar = 'ar'
          strip = 'strip'
          [host_machine]
          system = 'darwin'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'
          [properties]
          needs_exe_wrapper = false
          INI
            cross=(--cross-file "$RUNNER_TEMP/cross.ini")
          fi
          meson setup build ${cross[@]+"${cross[@]}"} --prefix="$RUNNER_TEMP/phronesis-prefix" \
            --buildtype=release -Dtests=disabled
          meson compile -C build
          meson install -C build
          echo "PHRONESIS_DIR=$RUNNER_TEMP/phronesis-prefix" >> "$GITHUB_ENV"
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: The binary reports phronesis
        if: matrix.cross == ''
        run: |
          set -eu
          bin=target/${{ matrix.target }}/release/ljos-policyd
          "$bin" version | tee /dev/stderr | grep -q '(phronesis)'
          # Nothing from the build machine on the load path.
          if [ "$RUNNER_OS" = Linux ]; then
            ! readelf -d "$bin" | grep -E 'RPATH|RUNPATH'
            ! ldd "$bin" | grep -E 'phronesis|capnp'
          else
            ! otool -L "$bin" | grep -E 'phronesis|capnp'
          fi
          cd "$RUNNER_TEMP"
          export PHRONESIS_STATE_DIR="$RUNNER_TEMP/policyd-state"
          "$GITHUB_WORKSPACE/$bin" check -- npm test
          ! "$GITHUB_WORKSPACE/$bin" check -- git push --force origin main
      - run: |
          set -eu
          name="ljos-policyd-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/ljos-policyd "dist/$name/"
          cp README.md LICENSE* "dist/$name/" 2>/dev/null || true
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The build attestations: a signed statement that this workflow built
      # each archive, which `gh attestation verify` and the ljos installer check.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # A signed statement that this workflow built each archive, which
      # `gh attestation verify` and the ljos installer check.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      # A release opened in the browser already has its notes; this line goes
      # after them instead of replacing them.
      - name: The phronesis ref
        id: phronesis
        run: |
          set -eu
          ref="${PHRONESIS_REF:-}"
          if [ -z "$ref" ]; then
            ref=$(python3 scripts/crate_version.py --phronesis-rev)
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          append_body: true
          body: Checks a shell command line and prints allow or deny. Links phronesis ${{ steps.phronesis.outputs.ref }}.
