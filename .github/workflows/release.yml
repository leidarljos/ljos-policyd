name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # Runs the build jobs on a branch without publishing a release.
  workflow_dispatch:

permissions:
  contents: write

# phronesis comes in through the phronesis-sys crate, whose version
# Cargo.lock pins: cargo compiles its vendored C for each target, so no
# meson, capnp or pkg-config is installed and no phronesis build runs here.

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            cross: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: The binary reports phronesis
        if: matrix.cross == ''
        run: |
          set -eu
          bin=target/${{ matrix.target }}/release/ljos-policyd
          "$bin" version | tee /dev/stderr | grep -q '(phronesis 0\.'
          # Nothing from the build machine on the load path.
          if [ "$RUNNER_OS" = Linux ]; then
            ! readelf -d "$bin" | grep -E 'RPATH|RUNPATH'
            ! ldd "$bin" | grep -E 'phronesis|capnp'
          else
            ! otool -L "$bin" | grep -E 'phronesis|capnp'
          fi
          cd "$RUNNER_TEMP"
          export PHRONESIS_STATE_DIR="$RUNNER_TEMP/policyd-state"
          "$GITHUB_WORKSPACE/$bin" check -- npm test
          ! "$GITHUB_WORKSPACE/$bin" check -- git push --force origin main
      - run: |
          set -eu
          name="ljos-policyd-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/ljos-policyd "dist/$name/"
          cp README.md LICENSE* "dist/$name/" 2>/dev/null || true
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The build attestations: a signed statement that this workflow built
      # each archive, which `gh attestation verify` and the ljos installer check.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # A signed statement that this workflow built each archive, which
      # `gh attestation verify` and the ljos installer check.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      # A release opened in the browser already has its notes; this line goes
      # after them instead of replacing them.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          append_body: true
          body: Checks a shell command line and prints allow or deny. phronesis is compiled in from the phronesis-sys crate; `ljos-policyd version` names its version.
