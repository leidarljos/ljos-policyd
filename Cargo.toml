[package]
name = "ljos-policyd"
version = "0.6.4"
edition = "2021"
license = "MIT"
rust-version = "1.88"
description = "Argv law for the leiðarljós seat. Prints a verdict. Sits on phronesis."
repository = "https://github.com/leidarljos/ljos-policyd"
homepage = "https://leidarljos.github.io/ljos-policyd/"
readme = "README.md"
keywords = ["policy", "argv", "ljos"]
categories = ["command-line-utilities"]

[lib]
name = "ljos_policyd"
path = "src/lib.rs"

[[bin]]
name = "ljos-policyd"
path = "src/main.rs"

[dependencies]
capnp = "0.27"
icu_casemap = "=2.4.0"
icu_locale_core = "=2.4.0"
icu_properties = "=2.4.0"
icu_properties_data = "=2.4.0"
idna = "1"
libc = "0.2"
# phronesis itself, compiled from the crate's vendored C with its pack
# embedded. The commit here moves to a crates.io version once the crate is
# published; a git dependency keeps `cargo publish` from running.
phronesis-sys = { git = "https://github.com/leidarljos/phronesis", rev = "74f2b59fd4ac5c575258837b99e34acff02d6473" }
unicode-normalization = "=0.1.26"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/ljos-policyd-v{ version }-{ target }.tar.gz"
bin-dir = "ljos-policyd-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
# The release tarball first. A target without one builds from source.
disabled-strategies = ["quick-install"]
